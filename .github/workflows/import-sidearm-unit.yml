name: Import verified sidearm support unit
on:
  push:
    branches: [fix/006-sidearm-support]
    paths: [.github/workflows/import-sidearm-unit.yml]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'CripterHack/distrito-cero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify every old and new file before writing source
        run: |
          set -euo pipefail
          curl --fail --location --max-time 120 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Icvp3WfrHKY6QGnlXqcYgbAGfb/f738816b-1fd8-4da7-81cf-bfc183910d08.zip' -o "$RUNNER_TEMP/source-unit.zip"
          echo '3a0556139b5f2807a52802d1c9fe61c87175ddedc67c678093e9e8a873e0f104  '"$RUNNER_TEMP/source-unit.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,subprocess,zipfile
          root=pathlib.Path.cwd()
          digest=lambda b:hashlib.sha256(b).hexdigest()
          assert digest((root/'index.html').read_bytes())=='a640437cde77a8fbba0af5f40d3e17013ecc027b0bbc29ee52f8e92db63baa68'
          expected={'docs/project/BACKLOG.md','docs/project/HANDOFF.md','docs/project/QA.md','docs/project/SIDEARM-SUPPORT.md','docs/project/STATE.md','qa/sidearm-support/README.md','qa/sidearm-support/comparison.jpg','qa/sidearm-support/preview.jpg','qa/sidearm-support/reference.json','specs/003-weapon-contact/plan-sidearm-support.md','src/weapon-handling.js','tests/helpers/hand_support.cjs','tests/qa_selection.test.py','tests/sidearm-support.test.cjs','tests/sidearm_support_browser.py','tools/qa/calibrate_sidearm.cjs','tools/qa/hand_support_surfaces.js','tools/qa/run.py'}
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'source-unit.zip') as z:
              assert len(z.infolist())==len(expected)+1
              assert set(z.namelist())==expected|{'UNIT-MANIFEST.json'}
              assert sum(i.file_size for i in z.infolist())<2000000
              assert all(not stat.S_ISLNK(i.external_attr>>16) for i in z.infolist())
              m=json.loads(z.read('UNIT-MANIFEST.json'))
              assert m['baseCommit']=='e614ff98061b9454eb47680bea7875a745373f3b'
              assert set(m['files'])==expected
              for name,entry in m['files'].items():
                  p=root/name
                  assert p.resolve().is_relative_to(root) and '.git' not in p.parts
                  assert digest(z.read(name))==entry['sha256'],name
                  if entry['beforeSha256'] is None: assert not p.exists(),name
                  else: assert p.is_file() and digest(p.read_bytes())==entry['beforeSha256'],name
              for name in expected:
                  p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(name))
          subprocess.run(['python3','build.py'],check=True)
          assert digest((root/'index.html').read_bytes())==m['outputHtmlSha256']=='60ec959537830481fc62f67caeb6d2fee7e3530aa43f76b42646e3b426086c92'
          print('Verified 18 source/evidence files and rebuilt HTML.')
          PY
          node --test tests/*.test.cjs
          python3 tests/qa_runner.test.py
          python3 tests/qa_reporting.test.py
          python3 tests/qa_selection.test.py
      - name: Publish only on the isolated feature branch
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: fit sidearm support around the dominant hand without moving palms (#6)'
          git push origin HEAD:refs/heads/fix/006-sidearm-support
          echo 'Await ordinary PR checks and visual review before merging. Remove this one-time importer with the authorized workflow editor.' >> "$GITHUB_STEP_SUMMARY"
