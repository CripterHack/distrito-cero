name: Build verified optical shoulder correction once
on:
  push:
    branches: [fix/006-shoulder-transitions]
    paths: [.github/workflows/build-optical-shoulders.yml]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'CripterHack/distrito-cero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Reproduce the old failures and apply the tested minimal change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          def sha(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert sha('index.html')=='47cbc618241b3419e300d76480176f77287ca80ee449edf14c78d1af4f32e875'
          assert sha('tests/shoulder-motion.test.cjs')=='76b0c192039e89d9b74d14911b30699f393f5241035f38ff08199d5ac7f66f38'
          assert sha('tests/optical_shoulder.py')=='b31c213eb81b5e7de85590f4dca47b70943cddbfd51bfc296f0e169a0bf088df'
          p=subprocess.run(['node','--test','tests/shoulder-motion.test.cjs'],capture_output=True,text=True)
          print(p.stdout)
          assert p.returncode!=0 and '# fail 6' in p.stdout, 'Expected six regressions before the correction'
          def replace(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,path;p.write_text(s.replace(old,new))
          replace('src/weapon-handling.js',"binoculars:{family:'optics',primary:","// Compact near-face optics need forward/downward elbows. The generic rear pole\n  // nearly opposes the raised wrist direction when crouching and flips the IK plane.\n  binoculars:{family:'optics',elbows:{L:[-.5,-.25,1],R:[.5,-.25,1]},primary:")
          replace('src/weapon-handling.js',"pole:k==='L'?[-.72,-1,-.18]:[.60,-1,-.30]","pole:spec.elbows?.[k]||(k==='L'?[-.72,-1,-.18]:[.60,-1,-.30])")
          replace('src/equipment-simulation.js',"e.aimWeight=D.damp(e.aimWeight,(e.aiming||fire)?1:0,12,dt);","// Near-face optics raise/lower more gradually, without changing zoom or fire rules.\n   e.aimWeight=D.damp(e.aimWeight,(e.aiming||fire)?1:0,w.kind==='optics'?6:12,dt);")
          replace('tools/qa/run.py','SUITES={\n',"SUITES={\n 'optical': Suite('optical',('tests/optical_shoulder.py',),'qa/v019/optical-shoulder.json',14),\n")
          replace('tests/qa_selection.test.py',"len(select_suites(['all'],'fixture')),7","len(select_suites(['all'],'fixture')),8")
          replace('tests/qa_selection.test.py',"if __name__=='__main__':","    def test_optical_cycle_cannot_be_mislabeled_as_native_persistence(self):\n        self.assertEqual(select_suites(['optical'],'fixture')[0].expected_checks,14)\n        with self.assertRaises(ValueError):select_suites(['optical'],'http')\nif __name__=='__main__':")
          assert sha('src/weapon-handling.js')=='047039c8ba3be15edd531741a89dcb36823835e9c7bc19b75c248bef4f949fde'
          assert sha('src/equipment-simulation.js')=='8ae852d6f1ea9baf2ccbbf59f6dd7540e6987e341d7bbd35d654170622d9092c'
          assert sha('tools/qa/run.py')=='ddd174e19bd57046b0f29ce37f79e37c68d29e31e6147db56405bfa343d3e5e2'
          assert sha('tests/qa_selection.test.py')=='6332d004efc266fb7d9e323497d7422c3845b111712982a30b22494c433dc08c'
          subprocess.run(['python3','build.py'],check=True)
          assert sha('index.html')=='fe47dfa3ef9b2bff6d415b6f6fb0b64e0d0b0c0df7193b135c59e4fc3fe7b93b'
          assert sha('src/hero-asset.js')=='a4f5a6522f0012290bd2fca8d573ca5243388474f72fb026cf5766924e3c8b7d'
          PY
          node --test tests/*.test.cjs
          python3 tests/qa_selection.test.py
          python3 tests/qa_runner.test.py
          python3 tools/rebind_garment.py --check
      - name: Publish source only on the feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -z "$(git diff --name-only -- .github/workflows)"
          git add src/weapon-handling.js src/equipment-simulation.js index.html tools/qa/run.py tests/qa_selection.test.py
          git commit -m 'fix: stabilize optical elbow planes and smooth raise/lower presentation (#6)'
          git push origin HEAD:refs/heads/fix/006-shoulder-transitions
          sha256sum index.html >> "$GITHUB_STEP_SUMMARY"
          echo 'Await normal PR browser checks before merging. Remove this one-time workflow through the authorized connector.' >> "$GITHUB_STEP_SUMMARY"
