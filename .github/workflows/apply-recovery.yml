name: Apply verified graphics recovery patch
on:
  push:
    branches: [feat/004-graphics-recovery]
    paths: [.github/workflows/apply-recovery.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'CripterHack/distrito-cero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Check, apply and rebuild the authorized source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, tempfile, zlib
          root = pathlib.Path.cwd()
          parts = [root / ('.ci/recovery-' + str(i) + '.b64') for i in range(4)]
          text = ''.join(p.read_text().strip() for p in parts)
          # Correct the single identified transport character before hash verification.
          text = text.replace('BLoeirbUyUoDN', 'BLoeirUyUoDN')
          raw = base64.b64decode(text, validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'd34643454c7163581a3db77aaaff7f7bcd1656b414461e48a6a94a8b50cb484b'
          payload = json.loads(zlib.decompress(raw))
          expected = {'src/graphics-resources.js', 'src/graphics-recovery.js', 'tests/graphics-recovery.test.cjs', 'tests/graphics_recovery.py', 'docs/project/GRAPHICS-RECOVERY.md', 'docs/project/HANDOFF.md'}
          assert set(payload['files']) == expected
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest() == '3aa9a27f4941ea1c701069c61db133ab3c93087e35d833d4921ba25b8a4b059f'
          with tempfile.NamedTemporaryFile(mode='w', suffix='.patch', encoding='utf-8') as f:
              f.write(payload['patch']); f.flush()
              subprocess.run(['git', 'apply', '--check', f.name], check=True)
              subprocess.run(['git', 'apply', f.name], check=True)
          for name, content in payload['files'].items():
              path = root / name
              assert path.resolve().is_relative_to(root)
              if name != 'docs/project/HANDOFF.md':
                  assert not path.exists(), 'Refuse overwrite: ' + name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          def replace(path, old, new):
              p = root/path; s = p.read_text(); assert s.count(old) == 1, path
              p.write_text(s.replace(old, new), encoding='utf-8')
          replace('tools/qa/run.py', 'SUITES={\n', "SUITES={\n 'recovery': Suite('recovery',('tests/graphics_recovery.py',),'qa/v019/graphics-recovery.json',22),\n")
          replace('tests/qa_selection.test.py', "len(select_suites(['all'],'fixture')),5", "len(select_suites(['all'],'fixture')),6")
          replace('.github/workflows/ci.yml', '          xvfb-run -a python3 -m tools.qa.run --suite "$SUITE" --headed --output artifacts/ci-fixture', '          if [ "$SUITE" = all ]; then\n            xvfb-run -a python3 -m tools.qa.run --suite all --headed --output artifacts/ci-fixture\n          else\n            xvfb-run -a python3 -m tools.qa.run --suite handling --suite recovery --headed --output artifacts/ci-fixture\n          fi')
          subprocess.run(['python3', 'build.py'], check=True)
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest() == payload['htmlSha256']
          for p in parts: p.unlink()
          (root/'.github/workflows/apply-recovery.yml').unlink()
          print('Verified patched HTML:', payload['htmlSha256'])
          PY
          node --test tests/*.test.cjs
          python3 tests/qa_runner.test.py
          python3 tests/qa_selection.test.py
          python3 tests/native_support.test.py
      - name: Commit only to the feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: recover WebGL resources and preserve live sessions with explicit resume (#4)'
          git push origin HEAD:refs/heads/feat/004-graphics-recovery
          echo 'Source applied and rebuilt. Await normal PR browser CI before merging.' >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
