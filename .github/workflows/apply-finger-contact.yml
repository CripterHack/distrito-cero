name: Apply verified finger-contact source
on:
  push:
    branches: [fix/006-finger-contacts]
    paths: [.github/workflows/apply-finger-contact.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'CripterHack/distrito-cero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Import the checked source unit and reproduce its HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3Icvp3WfrHKY6QGnlXqcYgbAGfb/64109297-dbeb-4739-bc9e-03baf63a170c.zip' \
            --output "$RUNNER_TEMP/finger-source.zip"
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, stat, subprocess, zipfile
          root=Path.cwd();archive=Path(os.environ['RUNNER_TEMP'])/'finger-source.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='5838039a855d4082b2e37a76b1d5b69b2604bf547474850d0debfd0fee46a69d'
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()=='fe47dfa3ef9b2bff6d415b6f6fb0b64e0d0b0c0df7193b135c59e4fc3fe7b93b'
          expected={
           'src/weapon-handling.js','tests/qa_selection.test.py','tools/qa/run.py',
           'tests/finger-contact.test.cjs','tests/finger_contact_browser.py',
           'tests/helpers/finger_surfaces.cjs','tools/qa/finger_surfaces.js',
           'docs/project/FINGER-CONTACTS.md','docs/project/HANDOFF.md',
           'docs/project/STATE.md','docs/project/QA.md','docs/project/BACKLOG.md',
           'specs/003-weapon-contact/plan-finger-contacts.md',
           'qa/finger-contact/comparison.jpg','qa/finger-contact/preview.jpg',
           'qa/finger-contact/reference.json'}
          with zipfile.ZipFile(archive)as z:
              records=[i for i in z.infolist() if not i.is_dir()]
              assert len(records)==len(expected) and {i.filename for i in records}==expected
              assert sum(i.file_size for i in records)<1000000
              for i in records:
                  rel=PurePosixPath(i.filename)
                  assert not rel.is_absolute() and '..' not in rel.parts and not stat.S_ISLNK(i.external_attr>>16)
                  target=root.joinpath(*rel.parts)
                  assert target.resolve().is_relative_to(root)
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(i))
          subprocess.run(['python3','build.py'],check=True)
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()=='9fc46cc9e37110ba618b19f5591da15d414405e85d44b24e437b405322dca832'
          assert hashlib.sha256((root/'src/hero-asset.js').read_bytes()).hexdigest()=='a4f5a6522f0012290bd2fca8d573ca5243388474f72fb026cf5766924e3c8b7d'
          print('Verified source unit, unchanged humanoid asset and reproducible HTML.')
          PY
          node --test tests/*.test.cjs
          python3 tests/qa_selection.test.py
          python3 tests/qa_runner.test.py
      - name: Commit source to the feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: fit virtual prop contacts to finger lengths and smooth release (#6)'
          git push origin HEAD:refs/heads/fix/006-finger-contacts
          echo 'Source verified. Remove this one-time importer through the authorized connector and run normal PR CI before merge.' >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
