name: Materialize verified v0.20 source unit
on:
  push:
    branches: [fix/006-palm-webbing]
    paths: [.github/workflows/import-v020-unit.yml]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'CripterHack/distrito-cero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply exact reviewed source files and rebuild
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Icvp3WfrHKY6QGnlXqcYgbAGfb/0455bb1b-64f4-4087-9200-235fb16027db.zip' -o "$RUNNER_TEMP/v020.zip"
          echo '8243a03b8e9919f5b0250a591819499c7191a7be87bcf1443a8f63a1ce64cf9d  '"$RUNNER_TEMP/v020.zip" | sha256sum --check --strict
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,json,os,stat,subprocess,zipfile
          root=Path.cwd();sha=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'v020.zip') as z:
              entries=z.infolist()
              assert len(entries)==25 and len({i.filename for i in entries})==25
              assert sum(i.file_size for i in entries)<2000000
              manifest=json.loads(z.read('UNIT-MANIFEST.json'))
              assert manifest['baseCommit']=='91ba765b42adef857074aa708fb57b458f94f251'
              assert set(z.namelist())==set(manifest['files'])|{'UNIT-MANIFEST.json'}
              assert len(manifest['files'])==24
              assert sha((root/'index.html').read_bytes())==manifest['htmlBefore']
              plan={}
              roots={'assets','docs','specs','tests','tools'}
              named={'AGENTS.md','CHANGELOG.md','README.md','build.py','version.json','src/page.html'}
              for name,record in manifest['files'].items():
                  path=PurePosixPath(name);entry=z.getinfo(name)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  assert name in named or path.parts[0] in roots
                  assert not stat.S_ISLNK(entry.external_attr>>16)
                  dest=root.joinpath(*path.parts);assert dest.resolve().is_relative_to(root) and not dest.is_symlink()
                  old=sha(dest.read_bytes()) if dest.is_file() else None
                  assert old==record['beforeSha256'],'Concurrent edit: '+name
                  data=z.read(name);assert sha(data)==record['sha256'];plan[name]=data
              for name,data in plan.items():
                  p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          subprocess.run(['python3','build.py'],check=True)
          assert sha((root/'index.html').read_bytes())==manifest['htmlAfter']
          assert sha((root/'build-info.json').read_bytes())==manifest['buildInfoAfter']
          print('Verified v0.20 HTML:',manifest['htmlAfter'])
          PY
          python3 build.py --check
          python3 tests/release_build.test.py
          python3 tools/refine_thenar.py --check
          python3 tests/thenar_contour.test.py
          python3 tools/rebind_garment.py --check
          node --test tests/*.test.cjs
      - name: Commit source only to this feature branch
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: publish canonical v0.20 identity and legacy save compatibility (#19)'
          git push origin HEAD:refs/heads/fix/006-palm-webbing
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'Await reviewed workflow cleanup and complete PR CI before merge.' >> "$GITHUB_STEP_SUMMARY"
