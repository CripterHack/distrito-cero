name: Apply verified draw review
on:
  push:
    branches: [fix/006-aim-reference]
    paths: [.github/workflows/apply-draw-review.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'CripterHack/distrito-cero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and apply the reviewed patch
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Icvp3WfrHKY6QGnlXqcYgbAGfb/8247fe1c-6b00-4cba-80e8-9bac8bf9c661.zip' --output "$RUNNER_TEMP/review.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'e14ec5807f3cb8c974f2744e99b769e06cbea3bd1156345d3687e12d3c91602c'
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest() == '39a475fbeda4f620799bfda3aaec0994e55edd1dc2ad06c5f2426f992a58930c'
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist()) == {'review.patch', 'build.json'}
              assert sum(i.file_size for i in z.infolist()) < 65536
              patch = archive.with_suffix('.patch')
              patch.write_bytes(z.read('review.patch'))
              expected = json.loads(z.read('build.json'))
          paths = {line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
          allowed = {'CHANGELOG.md','docs/project/HANDOFF.md','docs/project/QA.md','docs/project/SIDEARM-SIGHT.md','docs/project/STATE.md','specs/003-weapon-contact/plan-sidearm-sight.md','src/weapon-handling.js','tests/qa_selection.test.py','tests/sidearm-draw-onset.test.cjs','tests/sidearm_sight_browser.py','tools/qa/run.py','version.json'}
          assert paths == allowed, paths
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          subprocess.run(['python3','build.py'],check=True)
          assert json.loads((root/'build-info.json').read_text()) == expected
          assert expected['htmlSha256'] == '4a78bcca34cd40b2c406b0642362f30a6b71303d8a4a6ace659e0ba4afc9918d'
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest() == expected['htmlSha256']
          PY
          node --test tests/*.test.cjs
          python3 tests/release_build.test.py
          python3 tests/release_checkout.test.py
          python3 tests/qa_selection.test.py
      - name: Commit generated source to the same feature branch
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: smooth initial sidearm draw without delaying input (#21)'
          git push origin HEAD:refs/heads/fix/006-aim-reference
          echo 'Patch and generated outputs verified. Remove this one-time workflow and require current PR CI before merge.' >> "$GITHUB_STEP_SUMMARY"
