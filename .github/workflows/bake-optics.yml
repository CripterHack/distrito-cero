name: Apply verified optical posture patch once
on:
  push:
    branches: [fix/006-optics-posture]
    paths: [.github/workflows/bake-optics.yml]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'CripterHack/distrito-cero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce the original regression and apply the tested patch
        run: |
          set -euo pipefail
          echo '47cbc618241b3419e300d76480176f77287ca80ee449edf14c78d1af4f32e875  index.html' | sha256sum --check --strict
          python3 - <<'PY'
          import subprocess
          p=subprocess.run(['node','--test','tests/shoulder-motion.test.cjs'],capture_output=True,text=True)
          print(p.stdout)
          assert p.returncode != 0 and '# fail 6' in p.stdout, 'Six original optical regressions must reproduce before patching'
          PY
          git apply --check .ci/optics-runtime.patch
          git apply .ci/optics-runtime.patch
          echo '047039c8ba3be15edd531741a89dcb36823835e9c7bc19b75c248bef4f949fde  src/weapon-handling.js' | sha256sum --check --strict
          echo '8ae852d6f1ea9baf2ccbbf59f6dd7540e6987e341d7bbd35d654170622d9092c  src/equipment-simulation.js' | sha256sum --check --strict
          python3 build.py
          echo 'fe47dfa3ef9b2bff6d415b6f6fb0b64e0d0b0c0df7193b135c59e4fc3fe7b93b  index.html' | sha256sum --check --strict
          node --test tests/*.test.cjs
          rm .ci/optics-runtime.patch
      - name: Commit source and generated HTML only to the feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -z "$(git diff --name-only -- .github/workflows)"
          git add src/weapon-handling.js src/equipment-simulation.js index.html .ci/optics-runtime.patch
          git commit -m 'fix: stabilize near-face optical elbows and presentation cadence (#6)'
          git push origin HEAD:refs/heads/fix/006-optics-posture
          echo 'Source applied on feature branch. Normal PR tests and review required before Pages publication.' >> "$GITHUB_STEP_SUMMARY"
