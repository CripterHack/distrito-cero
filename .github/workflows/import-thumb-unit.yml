name: Import verified thumb animation unit
on:
  push:
    branches: [fix/006-thumb-opposition]
    paths: [.github/workflows/import-thumb-unit.yml]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'CripterHack/distrito-cero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify and import only the authorized unit
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Icvp3WfrHKY6QGnlXqcYgbAGfb/91b0e6b9-2804-4707-9069-61c192573297.zip' -o "$RUNNER_TEMP/thumb.zip"
          echo 'bf0e61e521450e0dbdbd57159b08fdbc4508a8e6c06939064bc39a206b5a2841  '"$RUNNER_TEMP/thumb.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,subprocess,zipfile
          root=pathlib.Path.cwd()
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()=='9fc46cc9e37110ba618b19f5591da15d414405e85d44b24e437b405322dca832'
          allowed={'docs/project/BACKLOG.md','docs/project/HANDOFF.md','docs/project/QA.md','docs/project/STATE.md','src/skin-rig.js','src/weapon-handling.js','tests/finger-contact.test.cjs','tests/qa_selection.test.py','tools/qa/run.py','docs/project/THUMB-CONTACTS.md','qa/thumb-contact/comparison.jpg','qa/thumb-contact/preview-support.jpg','qa/thumb-contact/preview.jpg','qa/thumb-contact/reference.json','specs/003-weapon-contact/plan-thumb-opposition.md','tests/thumb-contact.test.cjs','tests/thumb_contact_browser.py','tools/qa/calibrate_thumb.cjs'}
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'thumb.zip') as z:
              entries=z.infolist()
              assert len(entries)==len(allowed)+1
              assert {p.filename for p in entries}==allowed|{'UNIT-MANIFEST.json'}
              assert all(not stat.S_ISLNK(p.external_attr>>16) and p.file_size<2_000_000 for p in entries)
              manifest=json.loads(z.read('UNIT-MANIFEST.json'))
              assert set(manifest['files'])==allowed
              assert manifest['baseCommit']=='71fd53aed765bdb1d450ecba274bd2fd5522026c'
              for name,digest in manifest['files'].items():
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==digest,name
                  path=root/name
                  assert path.resolve().is_relative_to(root)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          subprocess.run(['python3','build.py'],check=True)
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()==manifest['htmlSha256']=='e538ababf8776ace42a3df88fdc105da20131fe9cbebc937f1df77d22932a521'
          print('Imported 18 verified files and regenerated the matching HTML.')
          PY
          node --test tests/*.test.cjs
          python3 tests/qa_selection.test.py
      - name: Commit source without workflow changes
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: articulate thumb opposition around a virtual metacarpal base (#6)'
          git push origin HEAD:refs/heads/fix/006-thumb-opposition
          echo 'Unit imported to the feature branch only. Await PR checks and visual review before integrating.' >> "$GITHUB_STEP_SUMMARY"
