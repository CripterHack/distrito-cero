name: Verify Distrito Cero
on:
  push:
    branches: [master, docs/spec-game-development]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_browser:
        description: Run all gameplay suites plus graphics recovery
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  core:
    name: Build, logic and export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: node
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.12'
      - name: Verify thenar authoring
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          python3 tools/refine_thenar.py --check
          python3 tests/thenar_contour.test.py
      - name: Verify garment binding
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          python3 tools/rebind_garment.py --check
          python3 tests/garment_binding.test.py
      - name: Verify immutable build and checkout
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          python3 build.py --check
          python3 tests/release_build.test.py
          python3 tests/release_checkout.test.py
      - name: Run all Node logic and pose tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          node --test tests/*.test.cjs
      - name: Verify QA and workflow contracts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          python3 tests/qa_runner.test.py
          python3 tests/qa_reporting.test.py
          python3 tests/qa_selection.test.py
          python3 tests/native_support.test.py
          python3 tests/reload_contract.test.py
          python3 tests/longarm_gallery.test.py
          python3 tests/ci_workflow.test.py
      - name: Verify contact exports
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          python3 tools/export_contact.py
          python3 tests/contact_exports.test.py
      - name: Verify generated assets unchanged
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          git diff --exit-code -- index.html assets/dc019-equipment.glb
      - name: Check current documentation links
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import re
          roots=[Path(p) for p in ['README.md','AGENTS.md','assets/README.md','docs/START-HERE.md','docs/spec-game-development.md']]
          for directory in ['docs/project','docs/adr','specs','.specify']:
              roots.extend(Path(directory).rglob('*.md'))
          bad=[]
          for file in roots:
              for link in re.findall(r'\[[^\]]*\]\(([^)]+)\)',file.read_text()):
                  t=urlsplit(link)
                  if not t.scheme and not t.netloc and t.path and not (file.parent/unquote(t.path)).exists(): bad.append((str(file),link))
          assert not bad,bad
          PY
  browser:
    name: WebGL ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [handoff, graphics]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install QA browser (development only)
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Run portable QA
        env:
          FULL_BROWSER: ${{ inputs.full_browser == true && 'true' || 'false' }}
          GROUP: ${{ matrix.group }}
          SUITE_TIMEOUT: ${{ matrix.group == 'handoff' && '1200' || '900' }}
        run: |
          if [ "$GROUP" = handoff ]; then
            suites=(--suite handoff)
          elif [ "$FULL_BROWSER" = true ]; then
            # Select every other fixture from the registry without duplicating
            # handoff or accidentally mixing native HTTP persistence into it.
            names=$(python3 -c "from tools.qa.run import SUITES; print(' '.join(k for k,v in SUITES.items() if v.origin=='fixture' and k!='handoff'))")
            suites=()
            for name in $names; do suites+=(--suite "$name"); done
          else
            suites=(--suite longarms --suite sight --suite thenar --suite sidearms --suite thumbs --suite fingers --suite handling --suite optical --suite recovery)
          fi
          xvfb-run -a python3 -m tools.qa.run "${suites[@]}" --headed --timeout "$SUITE_TIMEOUT" --output artifacts/ci-fixture
      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webgl-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-fixture/
          if-no-files-found: warn
          retention-days: 14
  native:
    name: Native saved games, tabs and reload lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Run native HTTP persistence and live reload input checks
        run: xvfb-run -a python3 -m tools.qa.run --suite release --suite native --suite reload --origin http --headed --timeout 1800 --output artifacts/ci-native
      - name: Upload fresh native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-native/
          if-no-files-found: warn
          retention-days: 14
