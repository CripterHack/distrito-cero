name: Verify Distrito Cero

on:
  push:
    branches: [master, docs/spec-game-development]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_browser:
        description: Run all five browser suites instead of the handling smoke suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Build, logic and export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify documented baseline is reproducible
        run: |
          python3 build.py
          node --test tests/*.test.cjs
          python3 tools/export_contact.py
          python3 tests/contact_exports.test.py
          git diff --exit-code -- index.html assets/dc019-equipment.glb
      - name: Check links in current documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import re
          roots = [Path('README.md'), Path('AGENTS.md'), Path('assets/README.md'), Path('docs/START-HERE.md'), Path('docs/spec-game-development.md')]
          for directory in ['docs/project', 'docs/adr', 'specs', '.specify']:
              roots.extend(Path(directory).rglob('*.md'))
          bad = []
          for file in roots:
              assert file.is_file(), str(file)
              for link in re.findall(r'\[[^\]]*\]\(([^)]+)\)', file.read_text()):
                  target = urlsplit(link)
                  if target.scheme or target.netloc or not target.path:
                      continue
                  path = file.parent / unquote(target.path)
                  if not path.exists():
                      bad.append((str(file), link))
          assert not bad, bad
          print('Checked', len(roots), 'current Markdown documents.')
          PY

  browser:
    name: WebGL handling smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FULL_BROWSER: ${{ inputs.full_browser == true && 'true' || 'false' }}
      QA_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the isolated QA browser
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          BROWSER="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$BROWSER"
          # Compatibility adapter for the original tests, limited to this disposable runner.
          sudo ln -sf "$BROWSER" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Run fresh WebGL evidence outside the historical tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dc-qa"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/dc-qa"
          cd "$RUNNER_TEMP/dc-qa"
          rm -rf qa/v019
          mkdir -p qa/v019/legacy
          python3 - <<'PY'
          from pathlib import Path
          import datetime, hashlib, json, os, subprocess, sys
          root = Path.cwd()
          out = root / 'qa/v019'
          sha = hashlib.sha256((root/'index.html').read_bytes()).hexdigest()
          suites = [('contact_browser', 'handling-browser.json', 51)]
          if os.environ.get('FULL_BROWSER') == 'true':
              suites += [('contact_arsenal', 'arsenal-browser.json', 78), ('contact_library', 'library-regression.json', 64), ('contact_legacy', 'legacy/browser-report.json', 52), ('contact_continuous', 'arsenal-continuous.json', 26)]
          manifest = {'commit': os.environ['QA_COMMIT'], 'htmlSha256': sha, 'startedUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'nativeStorage': False, 'physicalGpu': False, 'suites': []}
          failure = False
          for name, report_path, expected in suites:
              report_file = out / report_path
              report_file.unlink(missing_ok=True)
              entry = {'suite': name, 'expectedChecks': expected}
              with (out / (name + '.log')).open('w') as log:
                  try:
                      proc = subprocess.run(['xvfb-run', '-a', sys.executable, 'tests/'+name+'.py'], stdout=log, stderr=subprocess.STDOUT, timeout=600)
                      entry['exitCode'] = proc.returncode
                  except subprocess.TimeoutExpired:
                      entry['exitCode'] = 124
              try:
                  assert entry['exitCode'] == 0, 'suite process failed'
                  assert report_file.is_file(), 'fresh report missing'
                  report = json.loads(report_file.read_text())
                  checks = report['checks']
                  assert len(checks) >= expected, 'incomplete report'
                  assert all(c.get('pass', c.get('passed', False)) is True for c in checks), 'failed assertion'
                  assert not report.get('errors') and not report.get('requests'), 'runtime error or external request'
                  assert report['sha256'] == sha, 'report belongs to different HTML'
                  assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest() == sha, 'HTML changed during execution'
                  entry.update(status='passed', checks=len(checks))
              except (AssertionError, OSError, KeyError, ValueError) as error:
                  entry.update(status='failed', error=str(error))
                  failure = True
              manifest['suites'].append(entry)
              (out/'ci-run.json').write_text(json.dumps(manifest, indent=2))
              print(json.dumps(entry), flush=True)
              if failure:
                  break
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Fresh WebGL verification\n\n')
              summary.write('HTML SHA-256: `' + sha + '`\n\n')
              summary.write('Chromium + SwiftShader, injected HTML and explicit in-memory storage fixture. Not native persistence or a physical-GPU benchmark.\n\n')
              for result in manifest['suites']:
                  summary.write('* ' + result['suite'] + ': ' + result['status'] + '\n')
          if failure:
              raise SystemExit(1)
          PY
      - name: Upload this run only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webgl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dc-qa/qa/v019/
          if-no-files-found: warn
          retention-days: 14
