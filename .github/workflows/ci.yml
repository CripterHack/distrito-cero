name: Verify Distrito Cero
on:
  push:
    branches: [master, docs/spec-game-development]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_browser:
        description: Run all gameplay suites plus graphics recovery
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  core:
    name: Build, logic and export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 tools/rebind_garment.py --check
          python3 tests/garment_binding.test.py
          python3 build.py
          node --test tests/*.test.cjs
          python3 tests/qa_runner.test.py
          python3 tests/qa_selection.test.py
          python3 tests/native_support.test.py
          python3 tools/export_contact.py
          python3 tests/contact_exports.test.py
          git diff --exit-code -- index.html assets/dc019-equipment.glb
      - name: Check current documentation links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import re
          roots=[Path(p) for p in ['README.md','AGENTS.md','assets/README.md','docs/START-HERE.md','docs/spec-game-development.md']]
          for directory in ['docs/project','docs/adr','specs','.specify']:
              roots.extend(Path(directory).rglob('*.md'))
          bad=[]
          for file in roots:
              for link in re.findall(r'\[[^\]]*\]\(([^)]+)\)',file.read_text()):
                  t=urlsplit(link)
                  if not t.scheme and not t.netloc and t.path and not (file.parent/unquote(t.path)).exists(): bad.append((str(file),link))
          assert not bad,bad
          PY
  browser:
    name: WebGL handling, optics and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install QA browser (development only)
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Run portable QA
        env:
          FULL_BROWSER: ${{ inputs.full_browser == true && 'true' || 'false' }}
        run: |
          if [ "$FULL_BROWSER" = true ]; then
            xvfb-run -a python3 -m tools.qa.run --suite all --headed --output artifacts/ci-fixture
          else
            xvfb-run -a python3 -m tools.qa.run --suite handling --suite optical --suite recovery --headed --output artifacts/ci-fixture
          fi
      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webgl-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-fixture/
          if-no-files-found: warn
          retention-days: 14
  native:
    name: Native saved games and tabs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Reopen a real isolated browser profile at a local HTTP origin
        run: xvfb-run -a python3 -m tools.qa.run --suite native --origin http --headed --timeout 900 --output artifacts/ci-native
      - name: Upload fresh native persistence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-native/
          if-no-files-found: warn
          retention-days: 14
