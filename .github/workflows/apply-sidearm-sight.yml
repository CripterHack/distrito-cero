name: Apply verified sidearm sight source
on:
  push:
    branches: [fix/006-aim-reference]
    paths: [.github/workflows/apply-sidearm-sight.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'CripterHack/distrito-cero'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download and verify the authorized source unit
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Icvp3WfrHKY6QGnlXqcYgbAGfb/28e31532-50cf-49bf-b66a-ced116395fcf.zip' -o "$RUNNER_TEMP/source-unit.zip"
          echo '7e12b2411ce04c5ce7d479248b8a99d187a63a03864e9dfa3b14cc76ff754675  '"$RUNNER_TEMP/source-unit.zip" | sha256sum --check --strict
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,json,os,stat,subprocess,zipfile
          root=Path.cwd()
          sha=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'source-unit.zip') as z:
              infos=z.infolist()
              assert len(infos)==23 and len({i.filename for i in infos})==23
              manifest=json.loads(z.read('patch-manifest.json'))
              assert manifest['base']=='687ead22f3c3df565965b8e118221e8040bf6344'
              assert sha((root/'index.html').read_bytes())==manifest['baseHtml']
              expected={'CHANGELOG.md','README.md','assets/README.md','docs/project/BACKLOG.md','docs/project/HANDOFF.md','docs/project/QA.md','docs/project/SIDEARM-SIGHT.md','docs/project/STATE.md','docs/v020/GUIA.md','qa/sidearm-sight/README.md','qa/sidearm-sight/comparison.jpg','qa/sidearm-sight/preview.jpg','qa/sidearm-sight/reference.json','specs/003-weapon-contact/plan-sidearm-sight.md','src/weapon-handling.js','tests/helpers/sidearm_sight.cjs','tests/qa_selection.test.py','tests/sidearm-sight.test.cjs','tests/sidearm_sight_browser.py','tools/qa/run.py','tools/qa/sidearm_sight.js','version.json'}
              assert set(manifest['files'])==expected
              assert {i.filename for i in infos}==expected|{'patch-manifest.json'}
              planned={}
              for i in infos:
                  rel=PurePosixPath(i.filename)
                  assert not rel.is_absolute() and '..' not in rel.parts
                  assert '.git' not in rel.parts and '.github' not in rel.parts
                  assert not stat.S_ISLNK(i.external_attr>>16)
                  if i.filename=='patch-manifest.json':continue
                  data=z.read(i); entry=manifest['files'][i.filename]; p=root/i.filename
                  assert sha(data)==entry['after'],i.filename
                  if entry['before'] is None:assert not p.exists(),i.filename
                  else:assert p.is_file() and sha(p.read_bytes())==entry['before'],i.filename
                  planned[i.filename]=data
              for name,data in planned.items():
                  p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          subprocess.run(['python3','build.py'],check=True)
          info=json.loads((root/'build-info.json').read_text())
          assert info['htmlSha256']==manifest['resultHtml']=='39a475fbeda4f620799bfda3aaec0994e55edd1dc2ad06c5f2426f992a58930c'
          assert info['sourceSha256']==manifest['resultSource']
          print('Verified all 22 source/evidence files and deterministic HTML.')
          PY
          python3 build.py --check
          node --test tests/*.test.cjs
          python3 tests/release_build.test.py
          python3 tests/qa_selection.test.py
      - name: Commit source to feature branch only
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: align sidearm presentation with the posed avatar eye (#21)'
          git push origin HEAD:refs/heads/fix/006-aim-reference
          echo 'Source published only to feature branch. Remove one-time importer and require normal PR CI before merge.' >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
